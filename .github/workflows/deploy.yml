name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию только чтение; нужные права выдаются отдельным задачам ниже.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Проектный сайт: https://<owner>.github.io/rabochaya-tema/ (корень аккаунта занят kontur).
      # При переезде на свой домен: SITE=https://домен, BASE=/ — код не меняется.
      SITE: https://${{ github.repository_owner }}.github.io
      BASE: /rabochaya-tema/
    steps:
      # Версии закреплены по отпечатку коммита (защита от подмены метки). Обновляет Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
